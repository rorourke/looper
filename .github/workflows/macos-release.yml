name: Signed macOS release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: electron/pnpm-lock.yaml

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Install dependencies
        working-directory: electron
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        working-directory: electron
        run: pnpm audit --prod --audit-level high

      - name: Set release version from tag
        working-directory: electron
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a semantic version such as v1.2.3." >&2
            exit 1
          fi
          current_version="$(node -p "require('./package.json').version")"
          if [[ "$current_version" != "$release_version" ]]; then
            pnpm version "$release_version" --no-git-tag-version
          fi

      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: ./script/package_macos.sh release all

      - name: Upload public downloads and updater metadata
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        working-directory: electron
        run: node scripts/publish_macos_release.mjs

      - name: Keep a workflow copy of release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Looper-${{ github.ref_name }}-macOS
          if-no-files-found: error
          path: |
            electron/release/Looper-*-macOS-*.dmg
            electron/release/Looper-*-macOS-*.zip
            electron/release/Looper-*-macOS-*.zip.blockmap
            electron/release/Looper-Installer-*.dmg
          retention-days: 30
